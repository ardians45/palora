<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="PT Paletindo Prakarsa Unggul">
  <!-- Logo PT Paletindo Prakarsa Unggul, digambar ulang (HD) dari logo asli:
       cincin heksagon navy yang terbuka di sisi kiri-bawah + kubus emas bergaris putih
       yang sisi kirinya turun menutup bukaan itu (membentuk huruf "P"). -->
  <defs>
    <linearGradient id="ppu-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBBE33"/>
      <stop offset="1" stop-color="#C9951A"/>
    </linearGradient>
    <linearGradient id="ppu-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCA924"/>
      <stop offset="1" stop-color="#BF8A13"/>
    </linearGradient>
    <!-- ujung cincin di bawah dipotong tegak lurus tepat di rusuk depan kubus -->
    <clipPath id="ppu-ring-cut">
      <polygon points="0,0 100,0 100,100 50,100 50,58 20.5,58 20.5,100 0,100"/>
    </clipPath>
  </defs>

  <path d="M14.1 76 L14.1 29.25 L50 8.5 L85.9 29.25 L85.9 70.75 L50 91.5 L40 97.3"
        clip-path="url(#ppu-ring-cut)"
        fill="none" stroke="#1C2F6E" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>

  <g stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">
    <!-- atas -->
    <polygon points="50,17.5 78,33.7 50,49.8 22,33.7" fill="#E4B126"/>
    <!-- kanan -->
    <polygon points="50,49.8 78,33.7 78,66 50,82.2" fill="url(#ppu-right)"/>
    <!-- kiri, memanjang sampai tepi bawah cincin -->
    <polygon points="22,33.7 50,49.8 50,97.8 22,81.6" fill="url(#ppu-left)"/>
  </g>
</svg>
